# Dedicated log line for résumé downloads. Sent to stdout so it shows up in
# `docker logs portfolio` — grep for RESUME_DOWNLOAD to see who downloaded.
log_format resumelog 'RESUME_DOWNLOAD ts=$time_iso8601 ip=$remote_addr '
                     'ua="$http_user_agent" ref="$http_referer"';

server {
    listen       8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 256;

    # --- Résumé download (tracked) ---
    # Serves the PDF and logs every hit via the resumelog format above.
    location = /api/resume {
        alias /usr/share/nginx/html/assets/resume.pdf;
        default_type application/pdf;
        add_header Content-Disposition 'attachment; filename="Akash_Singh_Resume.pdf"' always;
        access_log /dev/stdout resumelog;
    }

    # Cache static assets
    location ~* \.(css|js|woff2?|png|jpe?g|gif|svg|ico|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
